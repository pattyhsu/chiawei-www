<!doctype html>
<meta charset="utf-8">
<title>家偉補習班 家長專區 圖文選單</title>
<!--
  LINE 圖文選單 (rich menu) artwork — 2500×843, the "compact" size.

  COMPACT, not large (Patty, 2026-08-18, after seeing 木生婦幼's): the first cut
  was 2500×1686 with a double-width 今日作業 block, and it read as "way too big
  and not useful" — a full-height panel covering the chat to say five words. A
  rich menu is a tab bar, not a poster. Five equal 500×843 columns, icon over label.

  學費 was REMOVED (Patty, 2026-08-20): the school collects four times a year, and
  "no parents wants to constantly see that they need to pay up". A permanent button
  for a quarterly errand is a standing reminder of a debt. The 未繳 chip on 首頁 is
  the way in now — it appears only when money is actually owed, and it is tappable.

  SIX, not five (Patty, 2026-08-19, after 木生's 首頁): the labels dropped from
  four characters to TWO, and that — not a smaller face — is what bought the
  room. 木生 fits five because 掛號/報告/意見/我的 are two chars; ours were four.
  The long names survive as the card HEADINGS inside each screen, which is how a
  tab bar normally works: the tab names the destination, the screen names itself.

  首頁 carries the brand blue. It exists because 今日作業 had been doing two
  jobs — it was secretly the home screen, so its label lied, and there was no way
  back to the overview from 餐費餘額 except tapping something that says homework.

  Rendered to richmenu.png by build.mjs. The tap areas in README.md are the
  other half of this file: move a column here and the map is wrong.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2500px;height:843px;overflow:hidden}
  body{
    font-family:"Noto Sans TC","PingFang TC","Heiti TC","Hiragino Sans GB",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;background:#fff;
  }
  .menu{
    width:2500px;height:843px;
    display:grid;grid-template-columns:repeat(5,1fr);
    /* NO vertical dividers — the reference bar (木生婦幼) has none, and at this
       size they read as clutter. One hairline across the top is all that is
       needed for the bar to sit apart from the conversation. */
    background:#fff;
    border-top:8px solid #E9ECF3;
  }
  .cell{
    background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:40px;
  }
  .cell svg{width:196px;height:196px;display:block}
  .cell .lbl{font-size:92px;font-weight:800;letter-spacing:.03em;line-height:1;color:#6B7280}
  /* the daily one — colour is the whole emphasis budget now */
  .on .lbl{color:#2547C7;font-weight:900}
</style>

<div class="menu">

  <div class="cell on">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2547C7" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.4 10.4 12 3.4l8.6 7"/>
      <path d="M5.4 12v8.4h13.2V12"/>
      <path d="M9.8 20.4v-5.2h4.4v5.2"/>
    </svg>
    <div class="lbl">首頁</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 24 24" fill="none" stroke="#8A90A2" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">

      <path d="M5 3.5a1.6 1.6 0 0 0 0 3.2h2.2"/>
      <path d="M8.6 12.2l2.4 2.4 4.6-5"/>
    </svg>
    <div class="lbl">作業</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 24 24" fill="none" stroke="#8A90A2" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="16" rx="2.4"/>

  <div class="cell">

         stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.8 11.6h16.4c0 4.5-3.7 8.2-8.2 8.2s-8.2-3.7-8.2-8.2z"/>
