<!doctype html>
<meta charset="utf-8">
<title>家偉補習班 家長專區 圖文選單</title>
<!--
  LINE 圖文選單 (rich menu) artwork — 2500×1686, the "large" size.

  Rendered to richmenu.png by build.mjs. LINE renders a rich menu as ONE flat
  image with invisible tap areas mapped over it, so the layout below and the
  areas in AREAS.md are two halves of one thing: move a box here and the map
  is wrong. Five buttons is the intended count (Patty, 2026-08-18) — 我要請假 /
  聯絡櫃檯 / 常見問題 were removed and NOT replaced with filler.

  The grid is a plain 3×2 of 833⅓ × 843 cells, because that is a stock LINE
  template. 今日作業 spans the top two cells VISUALLY, and both of those cells
  get the same link — so this needs no custom area map and can be built in
  LINE Official Account Manager with no Messaging API call.
-->
<style>
  @page { margin: 0 }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2500px;height:1686px;overflow:hidden}
  body{
    font-family:"Noto Sans TC","PingFang TC","Heiti TC","Hiragino Sans GB",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:#fff;
  }
  .menu{
    width:2500px;height:1686px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,1fr);
    /* the 8px gaps ARE the dividers — at a phone's ~1/6 scale they land near
       one physical pixel, which is the intended hairline */
    gap:8px;background:#E3E6EE;
  }
  .cell{
    background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:38px;
    color:#1A2F86;
  }
  .cell .lbl{font-size:118px;font-weight:900;letter-spacing:.04em;line-height:1}
  .cell .sub{font-size:60px;font-weight:700;color:#6B7280;letter-spacing:.02em;line-height:1;margin-top:-16px}
  .cell svg{width:206px;height:206px;display:block}

  /* 今日作業 — double-width, brand-filled: it is the one a parent opens on a
     normal weekday, so it is the only cell that reads as a primary action */
  .hw{
    grid-column:1 / span 2;
    background:#2547C7;color:#fff;
    gap:44px;
  }
  .hw .lbl{font-size:168px}
  .hw .sub{color:#C7D3FF;font-size:66px;margin-top:-14px}
  .hw svg{width:250px;height:250px}
  .hw .rule{width:190px;height:14px;background:#F8C414;border-radius:99px;margin-top:6px}
</style>

<div class="menu">

  <div class="cell hw">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 3.5h11.5a2 2 0 0 1 2 2V20a2 2 0 0 1-2 2H5z"/>
      <path d="M5 3.5a1.6 1.6 0 0 0 0 3.2h2.2"/>
      <path d="M8.6 12.2l2.4 2.4 4.6-5"/>
    </svg>
    <div class="lbl">今日作業</div>
    <div class="rule"></div>
    <div class="sub">課堂進度・回家功課</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2547C7" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="16" rx="2.4"/>
      <path d="M3 10h18M8 3v4M16 3v4"/>
      <path d="M7.4 14h3M7.4 17.6h3M13.6 14h3M13.6 17.6h3"/>
    </svg>
    <div class="lbl">每週課表</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2547C7" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.4" y="5.8" width="19.2" height="12.4" rx="2.2"/>
      <circle cx="12" cy="12" r="3.1"/>
      <path d="M5.9 9.4v5.2M18.1 9.4v5.2"/>
    </svg>
    <div class="lbl">本期學費</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2547C7" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.8 11.6h16.4c0 4.5-3.7 8.2-8.2 8.2s-8.2-3.7-8.2-8.2z"/>
      <path d="M2.2 20.6h19.6"/>
      <path d="M9.6 8.9c-1-1.1 1-2.1 0-3.2M14.4 8.9c-1-1.1 1-2.1 0-3.2"/>
    </svg>
    <div class="lbl">餐費餘額</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2547C7" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.4 20.4h17.2"/>
      <path d="M6.4 20.4v-5.8M11 20.4V9.6M15.6 20.4v-8.4M20.2 20.4V5.4"/>
      <path d="M4.6 8.6l5-4.2 3.4 2.6 5.6-4.4" stroke="#F8C414"/>
    </svg>
    <div class="lbl">學習進度</div>
  </div>

</div>
